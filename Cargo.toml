[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-channel = "2.5.0"
async-task = "4.7.1"
bytes = "1.11.1"
futures = "0.3.32"
log = "0.4.29"
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
# Same source sv2-apps declares, so that linking a real role unifies both into one copy.
stratum-core = { git = "https://github.com/stratum-mining/stratum", branch = "main" }
# The real roles under test, at the sv2-apps revision whose stratum-core the line above tracks.
pool_sv2 = { git = "https://github.com/stratum-mining/sv2-apps.git", rev = "ab8f30f1784ea20c2de1b2726c47e7eea10f4556", default-features = false }
stratum-apps = { git = "https://github.com/stratum-mining/sv2-apps.git", rev = "ab8f30f1784ea20c2de1b2726c47e7eea10f4556" }
# Their Bitcoin Core and sv2-tp launchers, so templates come from a node rather than from us.
integration_tests_sv2 = { git = "https://github.com/stratum-mining/sv2-apps.git", rev = "ab8f30f1784ea20c2de1b2726c47e7eea10f4556" }
tokio = { version = "1.44.1", features = ["rt-multi-thread"] }

env_logger = "0.11.10"

deterministic-simulator = { path = "crates/deterministic-simulator" }
stratamoto = { path = "crates/stratamoto" }
stratamoto-ir = { path = "crates/stratamoto-ir" }
stratamoto-fuzz = { path = "crates/stratamoto-fuzz" }
stratamoto-scenarios = { path = "crates/stratamoto-scenarios" }
stratamoto-targets = { path = "crates/stratamoto-targets" }
