[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzzer builds QEMU-Nyx on first build, which takes a while and its own dependencies,
# so it is built only when asked for: `cargo build -p stratamoto-libafl`.
default-members = [
    "crates/stratamoto",
    "crates/stratamoto-cli",
    "crates/stratamoto-dst",
    "crates/stratamoto-ir",
    "crates/stratamoto-macros",
    "crates/stratamoto-nyx-sys",
    "crates/stratamoto-scenarios",
    "crates/stratamoto-targets",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-channel = "2.5.0"
async-task = "4.7.1"
bytes = "1.11.1"
futures = "0.3.32"
log = "0.4.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
cc = "1"
# The protocol crates, re-exported by stratum-apps at the sv2-apps revision the pool binary
# under test is built from, so that the harness speaks the same wire format it does.
stratum-apps = { git = "https://github.com/stratum-mining/sv2-apps.git", rev = "ab8f30f1784ea20c2de1b2726c47e7eea10f4556", default-features = false, features = ["core"] }
# Their Bitcoin Core and sv2-tp launchers, so templates come from a node rather than from us.
integration_tests_sv2 = { git = "https://github.com/stratum-mining/sv2-apps.git", rev = "ab8f30f1784ea20c2de1b2726c47e7eea10f4556" }

env_logger = "0.11.10"

stratamoto-dst = { path = "crates/stratamoto-dst" }
stratamoto-macros = { path = "crates/stratamoto-macros" }
stratamoto-nyx-sys = { path = "crates/stratamoto-nyx-sys" }
stratamoto = { path = "crates/stratamoto" }
stratamoto-ir = { path = "crates/stratamoto-ir" }
stratamoto-scenarios = { path = "crates/stratamoto-scenarios" }
stratamoto-targets = { path = "crates/stratamoto-targets" }
