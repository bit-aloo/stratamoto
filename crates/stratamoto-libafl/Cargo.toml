[package]
name = "stratamoto-libafl"
version.workspace = true
edition.workspace = true
readme = "README.md"
description = "The fuzzer: LibAFL over Nyx, mutating IR programs"

[features]
default = []
# Run one client in process with a simple event manager: no fork, stop at the first bug.
simplemgr = []
introspection = ["libafl/introspection"]

[dependencies]
clap = { version = "4.5", features = ["derive", "string", "env"] }

# The revision fuzzamoto pins, whose APIs this crate is written against.
libafl = { git = "https://github.com/AFLplusplus/LibAFL.git", rev = "3b21190452d7289535aee443799ea55d940915c5", features = ["tui_monitor"] }
libafl_bolts = { git = "https://github.com/AFLplusplus/LibAFL.git", rev = "3b21190452d7289535aee443799ea55d940915c5", features = ["errors_backtrace"] }
libafl_nyx = { git = "https://github.com/AFLplusplus/LibAFL.git", rev = "3b21190452d7289535aee443799ea55d940915c5" }

stratamoto-ir.workspace = true

num-traits = { version = "0.2", default-features = false }
postcard.workspace = true
rand.workspace = true
regex = "1"
serde.workspace = true
serde_json = "1"
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "stratamoto-libafl"
path = "src/main.rs"
