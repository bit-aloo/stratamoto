[package]
name = "stratamoto-scenarios"
version.workspace = true
edition.workspace = true
readme = "README.md"

[dependencies]
stratamoto.workspace = true
stratamoto-ir.workspace = true
stratamoto-targets.workspace = true
postcard.workspace = true
tracing.workspace = true

[dev-dependencies]
rand.workspace = true

[features]
# Build the scenarios to run inside a Nyx VM, driven by the fuzzer.
nyx = ["stratamoto/nyx"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "pool_setup_connection"
path = "bin/pool_setup_connection.rs"
