name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/capnp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The fuzzer is checked in its own job, since building it builds QEMU-Nyx.
      - run: cargo clippy --workspace --exclude stratamoto-libafl --all-targets --all-features -- -D warnings

  machete:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@main

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/capnp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The real roles and the scenario binaries over them are excluded because they need a
      # Bitcoin Core node and the pool binary, not because the build is any lighter.
      - run: cargo test --workspace --exclude stratamoto-targets --exclude stratamoto-scenarios --exclude stratamoto-libafl --locked

  fuzzer:
    name: fuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzzer
      # libafl_nyx clones and builds QEMU-Nyx and the Nyx packer into the target directory.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pax-utils python3-msgpack python3-jinja2 libcapstone-dev ninja-build
      - run: cargo clippy -p stratamoto-libafl --all-targets -- -D warnings
      - run: cargo test -p stratamoto-libafl --locked

  real-roles:
    name: test against sv2-apps' pool
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/capnp
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # sv2-apps' launcher fetches Bitcoin Core into this directory when it is missing, which
      # is most of the job's time on a cold cache.
      - name: Cache Bitcoin Core
        uses: actions/cache@v4
        with:
          path: crates/stratamoto-targets/template-provider
          key: template-provider-${{ runner.os }}-v1

      # The pool under test is sv2-apps' own binary, at the revision the workspace pins.
      - name: Cache the pool binary
        id: pool
        uses: actions/cache@v4
        with:
          path: sv2
          key: pool-ab8f30f1784ea20c2de1b2726c47e7eea10f4556-v1
      - if: steps.pool.outputs.cache-hit != 'true'
        run: >
          cargo install --git https://github.com/stratum-mining/sv2-apps.git
          --rev ab8f30f1784ea20c2de1b2726c47e7eea10f4556 pool_sv2 --root sv2

      # The ignored test asserts an unfixed upstream livelock is present and is a race, so it
      # is deliberately not run here.
      - run: STRATAMOTO_POOL=$PWD/sv2/bin/pool_sv2 cargo test -p stratamoto-targets -p stratamoto-scenarios --locked
