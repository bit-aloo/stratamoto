name: Images

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: libafl
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built and not pushed: the point is that the image still builds. A campaign cannot run
      # here, since the runners offer no KVM with the VMware backdoor.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.libafl
          push: false
          tags: stratamoto-libafl:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
